<div
  class="group relative border border-gray-200 bg-white p-5 transition hover:-translate-y-1 hover:border-black shadow-sm">

  @if(pokemonImageUrl()){
  <img [src]="pokemonImageUrl()" [alt]="pokemon().name" class="mb-4 h-36 w-full object-contain bg-[#f8f7f4] p-2">
  }@else{
  <div class="mb-4 flex h-36 items-center justify-center bg-[#f8f7f4]">
    <span class="text-xs uppercase tracking-wider text-gray-400">[ Sprite ]</span>
  </div>
  }

  <span class="text-xs font-medium text-gray-400">#{{ pokemon().id }}</span>
  <h3 class="text-lg font-semibold text-black">{{ pokemon().name }}</h3>
  <div class="mt-3 flex gap-2">
    <span class="bg-gray-100 px-2 py-0.5 text-xs font-medium text-gray-700">Grass</span>
    <span class="bg-gray-100 px-2 py-0.5 text-xs font-medium text-gray-700">Poison</span>
  </div>
</div>
