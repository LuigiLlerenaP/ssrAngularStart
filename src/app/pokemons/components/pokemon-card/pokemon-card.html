<!-- 1. Enlace principal: Cambiamos <div> por <a> -->
<a [routerLink]="['/pokemons-details', pokemon().name]"
  class="group relative block border border-gray-200 bg-white p-5 shadow-sm transition hover:-translate-y-1 hover:border-black focus:outline-none focus-visible:ring-2 focus-visible:ring-black">

  <!-- 2. Contenedor semántico: <article> -->
  <article>

    <!-- 3. Multimedia: <figure> -->
    <figure class="mb-4 flex h-36 items-center justify-center bg-[#f8f7f4]">
      @if(pokemonImageUrl()) {
      <!-- Alt descriptivo mejorado -->
      <img [src]="pokemonImageUrl()" [alt]="'Sprite de ' + pokemon().name" class="h-full w-full object-contain p-2">
      } @else {
      <!-- Texto oculto a lectores de pantalla (es solo decorativo) -->
      <span class="text-xs uppercase tracking-wider text-gray-400" aria-hidden="true">[ Sprite ]</span>
      }
    </figure>

    <!-- 4. Cabecera de la tarjeta: <header> -->
    <header>
      <span class="block text-xs font-medium text-gray-400" aria-label="Número en la Pokédex">#{{ pokemon().id }}</span>
      <h3 class="text-lg font-semibold text-black">{{ pokemon().name }}</h3>
    </header>

    <!-- 5. Lista de elementos: <ul> y <li> -->
    <ul class="mt-3 flex gap-2" aria-label="Tipos">
      <li class="bg-gray-100 px-2 py-0.5 text-xs font-medium text-gray-700">Grass</li>
      <li class="bg-gray-100 px-2 py-0.5 text-xs font-medium text-gray-700">Poison</li>
    </ul>

  </article>
</a>
